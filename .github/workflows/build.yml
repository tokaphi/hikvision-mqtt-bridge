name: Build and publish image

# Se déclenche à chaque push sur main, ou manuellement depuis l'onglet
# "Actions" de GitHub si tu veux forcer un rebuild sans committer.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nécessaire pour que le job soit autorisé à publier un package sur
# ghcr.io du même dépôt, avec le token automatique de GitHub Actions
# (pas besoin de créer un secret séparé).
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # Permet de construire l'image arm64 (Raspberry Pi...) même si le
      # runner GitHub est en amd64, par émulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
